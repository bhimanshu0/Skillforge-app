<div class="sf-page fade-in">
  <div class="sf-page-header">
    <div>
      <nav aria-label="breadcrumb"><ol class="breadcrumb sf-breadcrumb mb-1">
        <li class="breadcrumb-item sf-muted">Home</li>
        <li class="breadcrumb-item active">Competency & Skill Gaps</li>
      </ol></nav>
      <h2 class="sf-page-title">Competency & Skill Gap Analysis</h2>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-7">
      <div class="sf-card h-100">
        <div class="sf-card-title"><i class="bi bi-bar-chart-steps me-2"></i>Competency Matrix</div>
        <div class="table-responsive mt-2">
          <table class="table sf-table mb-0">
            <thead><tr><th>Competency</th><th>Description</th><th>Level</th><th>Gap</th></tr></thead>
            <tbody>
              @for (m of matrix; track m.name) {
                <tr class="sf-table-row">
                  <td class="fw-semibold">{{ m.name }}</td>
                  <td class="sf-muted">{{ m.description }}</td>
                  <td><span class="sf-chip">{{ m.level }}</span></td>
                  <td><app-status-badge [status]="m.gap"></app-status-badge></td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-md-5">
      <div class="sf-card h-100">
        <div class="sf-card-title"><i class="bi bi-graph-up me-2"></i>Gap Closure Trend</div>
        <div class="sf-chart-placeholder mt-3">
          <div class="sf-bars">
            <div class="sf-bar" style="height:40%"></div>
            <div class="sf-bar" style="height:55%"></div>
            <div class="sf-bar" style="height:65%"></div>
            <div class="sf-bar" style="height:75%"></div>
            <div class="sf-bar" style="height:85%"></div>
          </div>
          <p class="sf-muted small text-center mt-2 mb-0">Gap closure over the last 5 periods</p>
        </div>

        <div class="mt-4">
          <div class="sf-card-title small mb-2">Summary</div>
          <div class="d-flex gap-2 flex-wrap">
            <div class="sf-stat-chip">
              <span class="fw-bold text-danger">1</span> High Gap
            </div>
            <div class="sf-stat-chip">
              <span class="fw-bold text-warning">1</span> Medium Gap
            </div>
            <div class="sf-stat-chip">
              <span class="fw-bold text-success">1</span> No Gap
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
